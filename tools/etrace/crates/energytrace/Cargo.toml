[package]
name = "energytrace"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "EnergyTrace current measurement with the XDS110 probe of a TI LaunchPad: capture session, stream decoder, calibration, and a pulse trace with statistics"
repository = "https://github.com/mayl/mspm0sleep"
publish = false

[features]
default = ["usb"]
# The capture session (`Session`), which talks to the probe through libusb.
# Without it the crate decodes and analyses saved captures and needs no C library.
usb = ["dep:rusb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusb = { version = "0.9", optional = true }
