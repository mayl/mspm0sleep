[package]
name = "etrace"
version = "0.1.0"
edition = "2021"
description = "EnergyTrace current measurement with a TI XDS110 probe: live terminal scope and headless captures"

[dependencies]
rusb = "0.9"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }

[profile.release]
debug = 1
