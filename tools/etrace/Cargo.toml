[package]
name = "etrace"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "EnergyTrace current measurement with a TI XDS110 probe, and debug access to sleeping MSPM0 chips: command-line tool with a terminal oscilloscope"
repository = "https://github.com/mayl/mspm0sleep"
publish = false

[workspace]
members = ["crates/xds110-sleep", "crates/energytrace"]

[dependencies]
energytrace = { path = "crates/energytrace" }
xds110-sleep = { path = "crates/xds110-sleep" }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
serde_json = "1"
ctrlc = "3"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }

[profile.release]
debug = 1
